<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="lumiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9EAA"/>
      <stop offset="50%" stop-color="#FFD07F"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#F43F5E" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Aura / Fondo circular suave -->
  <circle cx="60" cy="60" r="56" fill="#FFF7ED" stroke="#FDBA74" stroke-width="3"/>
  
  <!-- Orejitas esponjosas -->
  <path d="M 32 38 C 22 18, 42 12, 48 30 Z" fill="#FF9EAA" filter="url(#glow)"/>
  <path d="M 88 38 C 98 18, 78 12, 72 30 Z" fill="#FF9EAA" filter="url(#glow)"/>
  <path d="M 34 35 C 28 22, 40 18, 45 30 Z" fill="#FFF1F2"/>
  <path d="M 86 35 C 92 22, 80 18, 75 30 Z" fill="#FFF1F2"/>
  
  <!-- Cuerpo suave redondeado de Lumi -->
  <path d="M 30 65 C 30 38, 90 38, 90 65 C 90 92, 78 102, 60 102 C 42 102, 30 92, 30 65 Z" fill="url(#lumiGrad)" filter="url(#glow)"/>
  
  <!-- Coloretes sonrosados tiernos -->
  <ellipse cx="40" cy="74" rx="7" ry="4" fill="#FB7185" opacity="0.6"/>
  <ellipse cx="80" cy="74" rx="7" ry="4" fill="#FB7185" opacity="0.6"/>
  
  <!-- Ojitos brillantes kawaii -->
  <circle cx="46" cy="62" r="5.5" fill="#1E1B4B"/>
  <circle cx="48" cy="60" r="2" fill="#FFFFFF"/>
  <circle cx="45" cy="64" r="0.9" fill="#FFFFFF"/>
  
  <circle cx="74" cy="62" r="5.5" fill="#1E1B4B"/>
  <circle cx="76" cy="60" r="2" fill="#FFFFFF"/>
  <circle cx="73" cy="64" r="0.9" fill="#FFFFFF"/>
  
  <!-- Sonrisa tierna -->
  <path d="M 54 70 Q 60 76, 66 70" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Chispita mágica de gratitud -->
  <polygon points="60,20 62,25 67,26 63,29 64,34 60,31 56,34 57,29 53,26 58,25" fill="#FBBF24"/>
</svg>